name: Zig Build, Lint and Format

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  check-all:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Install Raylib dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev \
            libxrandr-dev \
            libxi-dev \
            libxcursor-dev \
            libxinerama-dev \
            libxrender-dev \
            libgl1-mesa-dev

      - name: Format check
        run: zig fmt --check .

      - name: Build snake
        run: cd projects/raylib-snake && zig build --summary all

      - name: Setup python
        uses: actions/setup-python@v6

      - name: Pre-commit checks
        uses: pre-commit/action@v3.0.1

      - name: Build all
        run: zig build --summary all all

      - name: Lint check
        run: zig build lint
